name: API Health Smoke Test (manual only)

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Deployed API origin, e.g. https://propertyos-api.onrender.com"
        type: string
        required: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check health without an always-on ping schedule
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          case "$API_ORIGIN" in https://*) ;; *) exit 1 ;; esac
          curl --fail --retry 2 --retry-delay 5 --max-time 120 "${API_ORIGIN%/}/api/v1/health"
